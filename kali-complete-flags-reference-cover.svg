<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#141c26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#1f2b38" stroke-width="2" rx="14"/>
  <text x="600" y="170" font-family="Consolas, monospace" font-size="38" fill="#4fd1ff" text-anchor="middle" font-weight="bold">COMPLETE FLAGS REFERENCE</text>
  <text x="600" y="215" font-family="Segoe UI, sans-serif" font-size="17" fill="#7d93a8" text-anchor="middle">Networking • File Ops • Text Processing • System • Security Tools</text>

  <g font-family="Consolas, monospace" font-size="15">
    <text x="120" y="300" fill="#4fd1ff">$ ip a</text>
    <text x="120" y="335" fill="#4fd1ff">$ rm -rf temp/</text>
    <text x="120" y="370" fill="#4fd1ff">$ netstat -tulnp</text>
    <text x="120" y="405" fill="#4fd1ff">$ grep -i "wscube" records</text>
    <text x="140" y="430" fill="#ff6b6b">wscubetech</text>
    <text x="120" y="470" fill="#4fd1ff">$ nmap -sC -sV -p- target.com</text>
    <text x="120" y="505" fill="#4fd1ff">$ tcpdump -i eth0 -w capture.pcap</text>
    <text x="120" y="545" fill="#4fd1ff">$ ssh -i id_rsa user@host</text>
  </g>

  <circle cx="1080" cy="90" r="6" fill="#ff6b81"/>
  <circle cx="1055" cy="90" r="6" fill="#facc15"/>
  <circle cx="1030" cy="90" r="6" fill="#4ade80"/>
</svg>
